[project]
name = "ollama-watch"
version = "0.1.0"
description = "Live prefill/decode progress for a local Ollama server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "David Landup" }]
keywords = ["ollama", "llm", "prefill", "monitoring", "mlx"]

[project.scripts]
ollama-watch = "ollama_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_watch"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
